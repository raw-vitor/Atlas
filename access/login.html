<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar - {{ app_name }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.split{display:grid;grid-template-columns:1fr 1fr;width:100%;min-height:100vh}
.left{position:relative;background:#004031;overflow:hidden}
.left::before,.left::after{content:"";position:absolute;border-radius:50%;filter:blur(64px);pointer-events:none}
.left::before{top:-96px;left:-96px;width:384px;height:384px;background:rgba(0,158,118,.25)}
.left::after{bottom:0;right:0;width:320px;height:320px;background:rgba(255,255,255,.10)}
.orb{position:absolute;top:50%;left:50%;width:min(31vw,62vh);height:min(31vw,62vh);transform:translate(-50%,-50%);z-index:1}
.orb .halo{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(0,185,139,.26) 0%,rgba(0,185,139,.08) 42%,rgba(0,185,139,0) 70%)}
.orb .corpo{position:absolute;inset:0;border-radius:50%;background:
  radial-gradient(circle at 36% 30%,rgba(214,255,241,.55) 0%,rgba(184,255,231,.18) 22%,rgba(184,255,231,0) 46%),
  radial-gradient(circle at 50% 50%,rgba(0,185,139,.30) 0%,rgba(0,120,92,.40) 62%,rgba(0,92,70,.75) 100%);
  box-shadow:inset 0 0 40px rgba(99,198,165,.28),0 0 60px rgba(0,185,139,.18)}
.orb .anel{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(99,198,165,.32)}
.orb .a1{transform:rotate(-18deg) scaleX(.42)}
.orb .a2{transform:rotate(-18deg) scaleX(.78)}
.orb .a3{transform:rotate(72deg) scaleX(.34);border-color:rgba(99,198,165,.22)}
.orb .a4{transform:rotate(72deg) scaleX(.7);border-color:rgba(99,198,165,.22)}
.orb .pontos{position:absolute;inset:0;border-radius:50%;background:
  radial-gradient(circle at 30% 40%,rgba(214,255,241,.9) 0 2px,transparent 3px),
  radial-gradient(circle at 62% 28%,rgba(214,255,241,.8) 0 2px,transparent 3px),
  radial-gradient(circle at 70% 62%,rgba(214,255,241,.9) 0 2px,transparent 3px),
  radial-gradient(circle at 44% 74%,rgba(214,255,241,.7) 0 2px,transparent 3px),
  radial-gradient(circle at 22% 62%,rgba(184,255,231,.6) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 80% 42%,rgba(184,255,231,.6) 0 1.5px,transparent 2.5px)}
.orb .giro{position:absolute;inset:0;animation:giro 90s linear infinite}
.orb .corpo{animation:respira 8s ease-in-out infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@media (prefers-reduced-motion:reduce){.orb .giro,.orb .corpo{animation:none}}
.brand{z-index:2;position:absolute;left:40px;bottom:36px;color:#f5f5f5;letter-spacing:.2em;font-size:.8rem;text-transform:uppercase}
.right{display:flex;align-items:center;justify-content:center;background:#fff;padding:24px}
.card{width:100%;max-width:380px;background:#fff;border:1px solid #ececec;border-radius:12px;padding:36px 32px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
.card h1{font-size:1.4rem;color:#141414;margin-bottom:6px}
.card p.sub{font-size:.9rem;color:#5c5c5c;margin-bottom:24px}
.card p.aviso{font-size:.85rem;color:#8a1c1c;background:#fdf3f3;border:1px solid #f0d0d0;border-radius:8px;padding:10px 12px;margin-bottom:16px}
cf-access-authbox{display:block}
.foot{margin-top:20px;text-align:center;font-size:.75rem;color:#566660}
.foot b{color:#a84a00}
@media(max-width:800px){.split{grid-template-columns:1fr}.left{display:none}}
</style>
</head>
<body>
<div class="split">
  <section class="left" aria-hidden="true">
    <div class="orb">
      <div class="halo"></div>
      <div class="corpo"></div>
      <div class="giro">
        <div class="anel a1"></div>
        <div class="anel a2"></div>
        <div class="anel a3"></div>
        <div class="anel a4"></div>
        <div class="pontos"></div>
      </div>
    </div>
    <div class="brand">Atlas</div>
  </section>
  <main class="right">
    <div class="card">
      <h1>Entrar</h1>
      <p class="sub">Use sua conta corporativa da EQI para continuar.</p>
      {% if message.text.size > 0 %}
      <p class="aviso" role="status">{{ message.text }}</p>
      {% endif %}
      <cf-access-authbox></cf-access-authbox>
      <div class="foot">Protegido por <b>Cloudflare Access</b></div>
    </div>
  </main>
</div>
</body>
</html>
